name: Update GitHub activity cards

on:
  schedule:
    - cron: "17 6 * * *"        # daily
  workflow_dispatch:
  push:
    branches: [main]
    paths: [scripts/github_stats.py, .github/workflows/stats.yml]

permissions:
  contents: write

jobs:
  cards:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Build cards from the GitHub API
        run: python scripts/github_stats.py
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          STATS_TOKEN: ${{ secrets.STATS_TOKEN }}     # optional personal token: includes private contributions
      - name: Commit changed cards
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add assets
          git diff --cached --quiet || { git commit -m "Update GitHub activity cards"; git push; }
